[project]
name = "mcpymol"
version = "1.5.1"
description = "A conversational MCP server interface for PyMOL protein visualization"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "chemrich" },
]
keywords = [
    "pymol",
    "mcp",
    "model-context-protocol",
    "claude",
    "gemini",
    "structural-biology",
    "protein-visualization",
    "bioinformatics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
]
# Declare what src/ imports, and cap each at the next major. CI installs from
# uv.lock, so a bound left open here is invisible until a user resolves fresh:
# mcp 2.0 removed mcp.server.fastmcp, and 1.5.x broke on install once nothing
# held mcp below it. Raise a cap only after the fresh-install job passes on it.
#   mcp       MCPServer and Image (mcp.server.mcpserver, app.py/rendering.py).
#             2.x: synchronous tools run on worker threads, hence app.SESSION_LOCK.
#   pydantic  Field metadata on every tool signature.
dependencies = [
    "mcp>=2.3.0,<3",
    "pydantic>=2,<3",
]

[project.urls]
Homepage = "https://github.com/chemrich/MCPymol"
Repository = "https://github.com/chemrich/MCPymol"
Issues = "https://github.com/chemrich/MCPymol/issues"
Changelog = "https://github.com/chemrich/MCPymol/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# 3D-print export (print_export tool): mesh repair to watertight STL.
# printing.py imports trimesh, pymeshlab, manifold3d, numpy and scipy directly;
# scikit-image is a soft dependency of trimesh for the calls it makes.
#   pymeshlab     poisson method. 2023.12.post2 is the first with macOS arm64 wheels.
#   manifold3d    exact boolean union of the sticks, spheres and rods that
#                 representation="displayed" exports. PyMOL writes those as
#                 primitives, not triangles, and voxelising them grew sticks 30-60%.
#   numpy, scipy  geometry and cKDTree in printing.py; scipy also backs
#                 trimesh's voxelized().fill().
#   scikit-image  marching_cubes in the voxel method, which is also auto's fallback;
#                 without it voxel raises ModuleNotFoundError. Pulls in networkx.
print = [
    "trimesh>=4.0",
    "pymeshlab>=2023.12.post2",
    "manifold3d>=3.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-image>=0.22",
]

[project.scripts]
mcpymol = "mcpymol.server:main"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "pytest-cov>=6.0",
    "ruff>=0.16.1",
    "mypy>=2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Network tests are opt-in (`pytest -m network`): CI must pass offline, but
# these check contracts with external APIs that mocks cannot catch drifting.
# Both extra suites are opt-in: CI must pass offline and without PyMOL, but
# these check contracts that mocks cannot — external APIs, and PyMOL itself.
addopts = "-m 'not network and not live'"
markers = [
    "network: hits a real external API; run before a release",
    "live: drives a running PyMOL; CLEARS ITS SESSION. `pytest -m live`",
]

[tool.ruff]
target-version = "py311"
line-length = 100

# plugin.py is not run by the bridge's Python. PyMOL `run`s it inside its own
# interpreter, which can be older than ours, so keep its syntax at the old floor.
[tool.ruff.per-file-target-version]
"src/mcpymol/plugin.py" = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Lenient start: these are deliberate style choices in this codebase, not
# bugs — left ignored for now so CI is green; revisit in a cleanup pass.
#   E701   single-line `if cond: stmt` bodies
#   E501   a handful of long lines
#   SIM105 try/except/pass preferred over contextlib.suppress here
#   RUF001/RUF002/RUF003  intentional en dashes in prose strings, docstrings
#          and comments. RUF002 joined the other two when mcpymol.wiggles
#          landed: its docstrings quote real ranges ("±5–15%", "0–1"), and a
#          hyphen there would misstate them.
ignore = ["E701", "E501", "SIM105", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Tests mock `pymol` in sys.modules before importing the package under test,
# so module-level imports legitimately come after that setup.
"tests/**" = ["E402"]

[tool.mypy]
files = ["src"]
python_version = "3.11"
# Lenient start: catch obvious mistakes without demanding full annotation
# coverage. Tighten (disallow_untyped_defs, strict) in a follow-up.
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = false
check_untyped_defs = true
