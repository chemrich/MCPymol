name: Release

# Publishing is driven by tags, not by pushes to main: the tag is the record
# of what was released, and a PyPI version is immutable once it exists.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # ci.yml runs on push-to-main and pull_request, neither of which a tag push
  # matches — so without this the only thing standing between `git tag` and an
  # immutable PyPI upload is `twine check`, which validates metadata and
  # nothing about whether the code works. A tag can point at any commit
  # (an amended one, a branch tip, a merge whose checks went red later), so
  # the gate has to run against the tagged ref itself rather than trust that
  # some earlier run covered it.
  verify:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Run pytest
        run: uv run pytest tests/ -v

  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups --extra print
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  print-extra:
    name: Print extra imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      # Run real-mesh print tests with the optional print extra and system libOpenGL.
      - name: System OpenGL for pymeshlab
        run: sudo apt-get update -q && sudo apt-get install -y -q libopengl0
      - name: Install with print extra
        run: uv sync --locked --all-groups --extra print
      - name: Import print_export
        run: uv run python -c "from mcpymol.server import print_export; print('print_export import OK')"
      - name: Print tests, against the real mesh libraries
        run: uv run pytest tests/test_printing.py -q -rs

  minimum-versions:
    name: Minimum versions (py3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      # Verify the declared dependency floors in pyproject.toml on the oldest supported Python.
      - name: System OpenGL for pymeshlab
        run: sudo apt-get update -q && sudo apt-get install -y -q libopengl0
      - name: Install at the declared minimums
        run: |
          uv venv --python 3.11 .venv-min
          uv pip install --python .venv-min/bin/python --resolution lowest-direct \
            --only-binary :all: -r pyproject.toml --extra print
          uv pip install --python .venv-min/bin/python --no-deps .
          # Test tools from the lock, so this job moves only when a runtime
          # floor does, never because pytest published a release.
          uv export --frozen --only-group dev --no-hashes --no-emit-project \
            | uv pip install --python .venv-min/bin/python -r -
      - name: Show what was installed
        run: uv pip list --python .venv-min/bin/python
      - name: Unit tests
        run: .venv-min/bin/python -m pytest tests/ -q -rs

  build:
    name: Build & verify
    needs: [verify, lint, print-extra, minimum-versions]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      # A published version can never be replaced, only superseded by another
      # release. Tagging v1.5.0 while pyproject still says 1.4.0 would upload
      # 1.4.0 under a v1.5.0 tag and burn the version number permanently, so
      # this checks the tag against the artefacts that are about to be
      # uploaded rather than against the source it was built from.
      - name: Tag matches built version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ ! -f "dist/mcpymol-${version}.tar.gz" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} implies version ${version}, but that is not what was built. Bump the version in pyproject.toml, or retag. dist/ contains:"
            ls -1 dist/
            exit 1
          fi

      - name: Validate package metadata
        run: uv run --with twine twine check dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Trusted Publishing (OIDC): PyPI verifies this exact repository, workflow
    # filename and environment, and hands back a short-lived token. There is
    # no API token stored in the repo to leak or rotate — but it does mean the
    # three names below are load-bearing and must match the pending publisher
    # registered on PyPI. Renaming this file breaks publishing.
    environment:
      name: pypi
      url: https://pypi.org/p/mcpymol
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
